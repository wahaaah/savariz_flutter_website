name: Build and deploy Flutter web to Vercel

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          cache-dependency-path: maningas_flutter_website-main/pubspec.lock

      - name: Install dependencies
        working-directory: maningas_flutter_website-main
        run: flutter pub get

      - name: Build Flutter web app
        working-directory: maningas_flutter_website-main
        run: flutter build web --release

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Deploy to Vercel
        run: npx vercel deploy "${{ github.workspace }}/maningas_flutter_website-main/build/web" --prod --yes --token="${{ secrets.VERCEL_TOKEN }}"
