<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#07101d" />
    <title>Virtual Try-On | Gonzales Vision Clinic</title>
    <style>
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
      body { background: #07101d; font-family: system-ui, sans-serif; }
      #faceFilterModal {
        position: fixed; inset: 0; display: none; align-items: center;
        justify-content: center; padding: 12px; background: #07101d;
      }
      .vto-dialog {
        position: relative; width: min(100%, 920px); height: min(100%, 720px);
        overflow: hidden; border-radius: 12px; background: #07101d;
      }
      #modal-container { position: absolute; inset: 0; }
      body[data-mobile-try-on="true"] #closeVTOBtn { display: none; }
      #closeVTOBtn {
        position: absolute; z-index: 5; top: 12px; right: 12px; width: 44px;
        height: 44px; border: 0; border-radius: 50%; color: white;
        background: #0f172acc; font-size: 26px; cursor: pointer;
      }
      #vto-status {
        position: absolute; z-index: 4; top: 18px; left: 16px; right: 68px;
        color: white; font: 500 14px/1.5 system-ui, sans-serif;
        text-shadow: 0 1px 5px #000;
      }
      #vto-controls {
        position: absolute; z-index: 5; right: 12px; bottom: 12px; left: 12px;
        display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 14px;
        align-items: center; padding: 12px; border-radius: 12px;
        background: #0f172acc; color: white;
        padding-bottom: calc(12px + env(safe-area-inset-bottom));
      }
      .vto-range-control {
        min-width: 0; display: flex; align-items: center; gap: 10px;
        font: 600 13px/1.3 system-ui, sans-serif;
      }
      .vto-range-control input { min-width: 0; flex: 1; accent-color: #3b82f6; touch-action: pan-y; }
      .vto-range-control output { width: 56px; text-align: right; font-variant-numeric: tabular-nums; }
      #vto-capture-btn {
        min-height: 44px; padding: 0 16px; border: 0; border-radius: 9px;
        background: #2563eb; color: white; font: 700 14px system-ui, sans-serif;
      }
      #vto-capture-btn:disabled { background: #64748b; cursor: not-allowed; }
      #vto-capture-status {
        grid-column: 1 / -1; min-height: 1em; color: #e2e8f0;
        font: 12px/1.4 system-ui, sans-serif;
      }
      @media (max-width: 600px) {
        #vto-controls { grid-template-columns: minmax(0, 1fr); gap: 10px; }
        #vto-capture-btn { width: 100%; }
        #vto-status { top: calc(12px + env(safe-area-inset-top)); left: 14px; right: 62px; font-size: 12px; }
      }
      @media (max-width: 600px) {
        #faceFilterModal { padding: 0; }
        .vto-dialog { width: 100%; height: 100dvh; border-radius: 0; }
      }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script defer src="./face-api.min.js"></script>
    <script defer src="./scripts.js"></script>
  </head>
  <body data-api="https://api.gonzalesvisionclinic.com">
    <div id="faceFilterModal" role="dialog" aria-modal="true" aria-label="Virtual Try-On">
      <div class="vto-dialog">
        <button id="closeVTOBtn" type="button" aria-label="Close Try-On">×</button>
        <div id="modal-container"></div>
        <div id="vto-status">Preparing virtual try-on...</div>
        <div id="vto-controls">
          <label class="vto-range-control" for="vto-scale">
            <span>Frame size</span>
            <input id="vto-scale" type="range" min="70" max="130" step="1" value="100" />
            <output id="vto-scale-value" for="vto-scale">100%</output>
          </label>
          <label class="vto-range-control" for="vto-rotation">
            <span>Rotate</span>
            <input id="vto-rotation" type="range" min="-45" max="45" step="1" value="0" />
            <output id="vto-rotation-value" for="vto-rotation">0°</output>
          </label>
          <label class="vto-range-control" for="vto-distance">
            <span>Distance</span>
            <input id="vto-distance" type="range" min="-100" max="100" step="1" value="0" />
            <output id="vto-distance-value" for="vto-distance">0 mm</output>
          </label>
          <label class="vto-range-control" for="vto-horizontal">
            <span>Left / right</span>
            <input id="vto-horizontal" type="range" min="-50" max="50" step="1" value="0" />
            <output id="vto-horizontal-value" for="vto-horizontal">0 mm</output>
          </label>
          <button id="vto-capture-btn" type="button" disabled>Take photo</button>
          <span id="vto-capture-status" role="status" aria-live="polite"></span>
        </div>
      </div>
    </div>
  </body>
</html>
